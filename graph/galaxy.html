<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Memory Galaxy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0b16;
        --fg: #e6e8f5;
        --muted: #8b90b3;
        --line: rgba(160, 165, 220, 0.18);
        --panel: rgba(14, 15, 30, 0.86);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.5 Inter, system-ui, sans-serif; overflow: hidden; }
      #graph { position: fixed; inset: 0; }
      .hud { position: fixed; pointer-events: none; z-index: 2; }
      .brand { top: 22px; left: 26px; }
      .brand h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.42em; }
      .brand .stats { margin-top: 4px; color: var(--muted); font-size: 11px; letter-spacing: 0.04em; }
      .legend { bottom: 22px; left: 26px; display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
      .legend span.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px currentColor; }
      .hint { bottom: 22px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 11px; letter-spacing: 0.03em; }
      .feed { top: 22px; right: 26px; width: 320px; display: grid; gap: 6px; }
      .feed div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 11px; color: var(--fg); animation: in 0.4s ease-out; }
      .feed div b { font-weight: 500; color: #c4b2ff; }
      @keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
      #search { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3; width: min(520px, 60vw); }
      #search input { width: 100%; height: 36px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 0 16px; font: inherit; outline: none; backdrop-filter: blur(8px); }
      #search input:focus { border-color: rgba(196, 178, 255, 0.55); }
      #answer { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); z-index: 3; width: min(560px, 70vw); max-height: 42vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: none; backdrop-filter: blur(8px); }
      #answer a { color: #c4b2ff; text-decoration: none; font-family: "JetBrains Mono", monospace; font-size: 11px; cursor: pointer; }
      #answer .close { float: right; color: var(--muted); cursor: pointer; }
      #panel { position: fixed; right: 26px; bottom: 22px; z-index: 3; width: 340px; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: none; backdrop-filter: blur(8px); }
      #panel h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
      #panel .meta { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
      #panel .excerpt { white-space: pre-wrap; font-size: 12px; color: #cfd2ea; }
      #panel .near { margin-top: 10px; display: grid; gap: 2px; }
      #panel .near button { all: unset; cursor: pointer; font-size: 12px; color: var(--fg); padding: 2px 0; }
      #panel .near button:hover { color: #c4b2ff; }
      #panel .actions { margin-top: 10px; display: flex; gap: 12px; font-size: 11px; }
      #panel .actions a { color: #c4b2ff; text-decoration: none; cursor: pointer; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); letter-spacing: 0.3em; font-size: 11px; text-transform: uppercase; z-index: 5; }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div class="hud brand"><h1>MEMORY</h1><div class="stats" id="stats"></div></div>
    <div class="hud legend" id="legend"></div>
    <div class="hud hint">Drag to orbit. Scroll to zoom. Click a star to open it.</div>
    <div class="hud feed" id="feed"></div>
    <div id="search"><input id="q" placeholder="Search, or ask a question ending in ?" autocomplete="off" /></div>
    <div id="answer"></div>
    <div id="panel"></div>
    <div id="loading">Gathering memories</div>
    <script type="module" src="/galaxy/main.js"></script>
  </body>
</html>
